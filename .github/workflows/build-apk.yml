name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optional: use when google-services.json is NOT committed to the repo.
      # Add repo secret GOOGLE_SERVICES_JSON = base64-encoded file contents.
      - name: Restore google-services.json from secret
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Verify Firebase Android config
        run: |
          test -f android/app/google-services.json || {
            echo "::error::android/app/google-services.json is missing."
            echo "Commit the file or set the GOOGLE_SERVICES_JSON repository secret (base64)."
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking warnings OK)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasty-kart-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload split APKs (if present)
        uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: tasty-kart-split-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
